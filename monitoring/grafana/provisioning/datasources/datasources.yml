# Grafana's data sources, created when Grafana starts: Prometheus for the metrics, Loki for the logs.
# The fixed uids are what the dashboard refers to.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
