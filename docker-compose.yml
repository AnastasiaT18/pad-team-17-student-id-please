# Team 17 - "Student ID, please"
#
# Runs the team's services from the images published on Docker Hub. It never builds from a
# Dockerfile: nobody is a collaborator on anybody else's private repository, so building locally is
# impossible for everyone except the owner of each service.
#
#   cp .env.example .env    # then fill in the passwords
#   docker compose up -d
#
# Each service owns its own database and creates its schema when it starts, so the database
# containers start empty on purpose.
#
# Services not yet published by their owners are commented out. Uncomment as they appear.

name: pad-team-17

services:
  # ---------------------------------------------------------------- infrastructure

  player-db:
    image: postgres:17-alpine
    container_name: pad17-player-db
    environment:
      POSTGRES_DB: player
      POSTGRES_USER: ${PLAYER_DB_USER}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD}
    volumes:
      - player-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_DB_USER} -d player"]
      interval: 10s
      timeout: 5s
      retries: 10

  server-moderation-session-db:
    image: postgres:17-alpine
    container_name: pad17-server-moderation-session-db
    environment:
      POSTGRES_DB: server_moderation_session
      POSTGRES_USER: ${SERVER_MODERATION_SESSION_DB_USER}
      POSTGRES_PASSWORD: ${SERVER_MODERATION_SESSION_DB_PASSWORD}
    volumes:
      - server-moderation-session-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SERVER_MODERATION_SESSION_DB_USER} -d server_moderation_session",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  applicant-db:
    image: postgres:16-alpine
    container_name: pad17-applicant-db
    environment:
      POSTGRES_DB: applicant
      POSTGRES_USER: ${APPLICANT_DB_USER}
      POSTGRES_PASSWORD: ${APPLICANT_DB_PASSWORD}
    volumes:
      # Named volume: the data outlives `docker compose down`.
      - applicant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APPLICANT_DB_USER} -d applicant"]
      interval: 10s
      timeout: 5s
      retries: 10

  credential-db:
    image: postgres:16-alpine
    container_name: pad17-credential-db
    environment:
      POSTGRES_DB: credential
      POSTGRES_USER: ${CREDENTIAL_DB_USER}
      POSTGRES_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
    volumes:
      - credential-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CREDENTIAL_DB_USER} -d credential"]
      interval: 10s
      timeout: 5s
      retries: 10

  server-rules-db:
    image: postgres:18
    container_name: pad17-server-rules-db
    environment:
      POSTGRES_DB: rules_db
      POSTGRES_USER: ${SERVER_RULES_DB_USER}
      POSTGRES_PASSWORD: ${SERVER_RULES_DB_PASSWORD}
    volumes:
      - server-rules-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVER_RULES_DB_USER} -d rules_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  university-record-db:
    image: postgres:18
    container_name: pad17-university-record-db
    environment:
      POSTGRES_DB: record_db
      POSTGRES_USER: ${UNIVERSITY_RECORD_DB_USER}
      POSTGRES_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
    volumes:
      - university-record-db-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${UNIVERSITY_RECORD_DB_USER} -d record_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  moderation-db:
    image: postgres:16-alpine
    container_name: pad17-moderation-db
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: ${MODERATION_DB_USER}
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD}
    volumes:
      - moderation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MODERATION_DB_USER} -d moderation"]
      interval: 10s
      timeout: 5s
      retries: 10

  discord-dms-db:
    image: postgres:16-alpine
    container_name: pad17-discord-dms-db
    environment:
      POSTGRES_DB: discord_dms
      POSTGRES_USER: ${DISCORD_DMS_DB_USER}
      POSTGRES_PASSWORD: ${DISCORD_DMS_DB_PASSWORD}
    volumes:
      - discord-dms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DISCORD_DMS_DB_USER} -d discord_dms"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- gateway
  gateway-service:
    image: anastasiatiganescu/gateway-service:${GATEWAY_VERSION:-0.4.0}
    container_name: pad17-gateway-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DISCORD_DMS_PUBLIC_URL: http://localhost:8086
      TASK_TIMEOUT_SECONDS: 5
      CONCURRENT_TASK_LIMIT: 20
      BROKER_URL: http://message-broker:8000
    depends_on:
      message-broker:
        condition: service_healthy
    ports:
      - "8090:8000"

  # ---------------------------------------------------------------- message broker
  message-broker:
    image: anastasiatiganescu/message-broker:${BROKER_VERSION:-0.1.0}
    container_name: pad17-message-broker
    environment:
      DISCOVERY_URL: http://discovery-service:8000
      EVENT_DB_PATH: /data/events.db
    volumes:
      - message-broker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      discovery-service:
        condition: service_healthy
    ports:
      - "8100:8000" # optional: lets you open /health and /logs from your browser
      
 # ---------------------------------------------------------------- discovery
  discovery-service:
    image: ${DISCOVERY_IMAGE:-dannacojocari/pad-team-17-discovery-service:0.2.0}
    container_name: pad17-discovery-service
    environment:
      # Health alerts also go to the developers' Telegram group, posted by the team's bot. The bot's
      # token is a secret: .env only.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # The share of an instance's busy request workers from which its load is critical - an alert.
      CRITICAL_LOAD_THRESHOLD: ${CRITICAL_LOAD_THRESHOLD:-0.8}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    

  # ---------------------------------------------------------------- pair 1 (Janeta)
  player-service:
    image: janetag/player-service:${PLAYER_VERSION:-0.4.1}
    environment:
      DB_HOST: player-db
      DB_PORT: 5432
      DB_NAME: player
      DB_USER: ${PLAYER_DB_USER}
      DB_PASSWORD: ${PLAYER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      PORT: 3000
      GRPC_PORT: 9090
      SERVICE_NAME: player-service
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      LOG_DIR: /logs
    volumes:
      - player-logs:/logs
    deploy:
      replicas: 2
    depends_on:
      player-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  server-moderation-session-service:
    image: janetag/server-moderation-session-service:${SERVER_MODERATION_SESSION_VERSION:-0.4.1}
    environment:
      DB_HOST: server-moderation-session-db
      DB_PORT: 5432
      DB_NAME: server_moderation_session
      DB_USER: ${SERVER_MODERATION_SESSION_DB_USER}
      DB_PASSWORD: ${SERVER_MODERATION_SESSION_DB_PASSWORD}
      APPLICANT_GRPC_URL: applicant-service:9090
      UNIVERSITY_RECORD_GRPC_URL: university-record-service:9090
      DISCORD_DMS_GRPC_URL: discord-dms-service:9090
      PORT: 3001
      GRPC_PORT: 9090
      SERVICE_NAME: server-moderation-session-service
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      BROKER_GRPC_URL: message-broker:9090
      BROKER_PUBLISH_TIMEOUT_MS: 1500
      LOG_DIR: /logs
    volumes:
      - session-logs:/logs
    deploy:
      replicas: 2
    depends_on:
      server-moderation-session-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
     
  # ---------------------------------------------------------------- pair 2 (Catalin)

  applicant-service:
    image: kutulin/pad-17-applicant-service:${APPLICANT_VERSION:-4.0.0}
    environment:
      DB_HOST: applicant-db
      DB_PORT: 5432
      DB_NAME: applicant
      DB_USER: ${APPLICANT_DB_USER}
      DB_PASSWORD: ${APPLICANT_DB_PASSWORD}
      # Events are published to the Message Broker over gRPC, and it delivers the topics this service
      # registers to its gRPC port. BROKER_URL is the broker's REST API, used if the gRPC address is empty.
      BROKER_GRPC_ADDRESS: message-broker:9090
      BROKER_URL: http://message-broker:8000
      SERVER_PORT: 8081
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      # Shifts are checked with Server Moderation Session Service over gRPC, behind a circuit breaker.
      SESSION_DIRECTORY: grpc
    deploy:
      replicas: 2
    depends_on:
      applicant-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  credential-service:
    image: kutulin/pad-17-credential-service:${CREDENTIAL_VERSION:-4.0.0}
    environment:
      DB_HOST: credential-db
      DB_PORT: 5432
      DB_NAME: credential
      DB_USER: ${CREDENTIAL_DB_USER}
      DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD}
      # Events are published to the Message Broker over gRPC, and it delivers the topics this service
      # registers to its gRPC port. BROKER_URL is the broker's REST API, used if the gRPC address is empty.
      BROKER_GRPC_ADDRESS: message-broker:9090
      BROKER_URL: http://message-broker:8000
      SERVER_PORT: 8082
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      # Shifts are checked with Server Moderation Session Service over gRPC, behind a circuit breaker.
      SESSION_DIRECTORY: grpc
    deploy:
      replicas: 2
    depends_on:
      credential-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ---------------------------------------------------------------- pair 3 (Anastasia)
  server-rules-service:
    image: anastasiatiganescu/server-rules-service:${SERVER_RULES_VERSION:-v0.4.0}
    environment:
      DB_URL: jdbc:postgresql://server-rules-db:5432/rules_db
      DB_USERNAME: ${SERVER_RULES_DB_USER}
      DB_PASSWORD: ${SERVER_RULES_DB_PASSWORD}
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      SERVICE_NAME: server-rules-service
      SERVICE_HTTP_PORT: 8080
      SERVICE_GRPC_PORT: 9090
      SERVICE_HEARTBEAT_SECONDS: 15
    deploy:
      replicas: 2
    depends_on:
      server-rules-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  university-record-service:
    image: anastasiatiganescu/university-record-service:${UNIVERSITY_RECORD_VERSION:-v0.4.0}
    environment:
      DB_URL: jdbc:postgresql://university-record-db:5432/record_db
      DB_USERNAME: ${UNIVERSITY_RECORD_DB_USER}
      DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD}
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      SERVICE_NAME: university-record-service
      SERVICE_HTTP_PORT: 8080
      SERVICE_GRPC_PORT: 9090
      SERVICE_HEARTBEAT_SECONDS: 15
      SESSION_CLIENT: grpc
      SESSION_SERVICE_NAME: server-moderation-session-service
    deploy:
      replicas: 2
    depends_on:
      university-record-db:
        condition: service_healthy
      message-broker: 
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ---------------------------------------------------------------- pair 4 (Daniela)
  moderation-service:
    image: dannacojocari/moderation-service:${MODERATION_VERSION:-v0.5.0}

    deploy:
      replicas: 2

    environment:
      PORT: 3000
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      SERVICE_HEARTBEAT_SECONDS: 15
      GRPC_DISCOVERY_ENABLED: "true"

      DB_HOST: moderation-db
      DB_PORT: 5432
      DB_USERNAME: ${MODERATION_DB_USER}
      DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      DB_NAME: moderation

      TASK_TIMEOUT_MS: 5000
      MAX_CONCURRENT_TASKS: 20

      APPLICANT_GRPC_URL: applicant-service:9090
      CREDENTIAL_GRPC_URL: credential-service:9090
      UNIVERSITY_RECORD_GRPC_URL: university-record-service:9090
      SERVER_RULES_GRPC_URL: server-rules-service:9090

      # The Moderation service publishes decision_made via the custom broker.
      DECISION_EVENT_TRANSPORT: broker-grpc
      BROKER_GRPC_TARGET: message-broker:9090

    depends_on:
      moderation-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      discovery-service:
        condition: service_healthy


  discord-dms-service:
    image: dannacojocari/discord-dms-service:${DISCORD_DMS_VERSION:-v0.5.0}

    deploy:
      replicas: 2

    environment:
      JWT_SECRET: ${JWT_SECRET:?Set the shared JWT signing secret}
      PORT: 3000
      LOG_DOWNLOAD_TOKEN: ${DISCORD_DMS_LOG_DOWNLOAD_TOKEN:?Set Discord DMs log download token}
      GRPC_URL: 0.0.0.0:9090
      SERVICE_DISCOVERY_URL: http://discovery-service:8000
      SERVICE_HEARTBEAT_SECONDS: 15
      REDIS_URL: redis://redis:6379

      DB_HOST: discord-dms-db
      DB_PORT: 5432
      DB_USERNAME: ${DISCORD_DMS_DB_USER}
      DB_PASSWORD: ${DISCORD_DMS_DB_PASSWORD}
      DB_NAME: discord_dms

      TASK_TIMEOUT_MS: 5000
      MAX_CONCURRENT_TASKS: 20

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.discord.rule=PathPrefix(`/socket.io/`) || Path(`/health`)"
      - "traefik.http.routers.discord.entrypoints=discord"
      - "traefik.http.routers.discord.service=discord"
      - "traefik.http.services.discord.loadbalancer.server.port=3000"
      - "traefik.http.services.discord.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.discord.loadbalancer.sticky.cookie.name=discord_route"
      - "traefik.http.services.discord.loadbalancer.sticky.cookie.httpOnly=true"

    depends_on:
      discord-dms-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  discord-proxy:
    image: traefik:v3.6.16
    container_name: pad17-discord-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.discord.address=:80"
    ports:
      - "8086:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - discord-dms-service

  # ---------------------------------------------------------------- monitoring (Lab 4, Grade 10)
  # Prometheus collects the metrics every 5 s (monitoring/prometheus), Alloy sends the logs of every
  # container to Loki (monitoring/alloy, monitoring/loki), and Grafana shows both on the dashboard in
  # monitoring/grafana/dashboards, set up when it starts.
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: pad17-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - message-broker
    ports:
      - "9091:9090" # the Prometheus UI: targets and queries

  grafana:
    image: grafana/grafana:13.3.1
    container_name: pad17-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # The dashboard opens without logging in, read-only; changes need the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pad-team-17.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"

  loki:
    image: grafana/loki:3.7.9
    container_name: pad17-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: pad17-alloy
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      # Only the containers of this Compose project have their logs collected.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: Alloy lists the containers and reads their output, it changes nothing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  message-broker-data:
  player-db-data:
  server-moderation-session-db-data:
  applicant-db-data:
  credential-db-data:
  server-rules-db-data:
  university-record-db-data:
  moderation-db-data:
  discord-dms-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  player-logs:
  session-logs:
